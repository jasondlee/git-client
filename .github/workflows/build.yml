name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 27
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Print toolchain versions
        run: |
          java -version
          mvn -version
          git --version
      - name: Verify build and run tests
        run: mvn --batch-mode --no-transfer-progress --fail-at-end verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14
