name: Package desktop application

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 27
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Build and verify modules
        run: mvn --batch-mode --no-transfer-progress install
      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev rpm xvfb libgtk-3-0
      - name: Install Windows packaging prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\bin' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wix) { $wix.FullName | Out-File -FilePath $env:GITHUB_PATH -Append }
      - name: Create modular runtime image
        run: mvn --batch-mode --no-transfer-progress -pl git-app javafx:jlink
      - name: Verify runtime includes application module
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            git-app/target/image/bin/java.exe --describe-module gitclient.app
          else
            git-app/target/image/bin/java --describe-module gitclient.app
          fi
      - name: Create platform application bundle
        shell: bash
        run: |
          jpackage --type app-image --name GitClient \
            --runtime-image git-app/target/image \
            --module gitclient.app/io.github.jasondlee.gitclient.app.GitClientApp \
            --dest dist
      - name: Build native Linux installers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          jpackage --type deb --app-image dist/GitClient --name gitclient \
            --app-version 0.1.0 --linux-shortcut --dest installers
          jpackage --type rpm --app-image dist/GitClient --name gitclient \
            --app-version 0.1.0 --linux-shortcut --dest installers
      - name: Build native Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          jpackage --type msi --app-image dist/GitClient --name GitClient \
            --app-version 0.1.0 --win-menu --win-shortcut --dest installers
      - name: Build native macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          jpackage --type dmg --app-image dist/GitClient.app --name GitClient \
            --app-version 0.1.0 --dest installers
      - name: Verify native installers
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ls installers/*.deb installers/*.rpm
            dpkg-deb --info installers/*.deb
            rpm -qip installers/*.rpm
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            ls installers/*.msi
          else
            ls installers/*.dmg
            hdiutil imageinfo installers/*.dmg
          fi
      - name: Verify application bundle exists
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -d dist/GitClient.app
            test -x dist/GitClient.app/Contents/MacOS/GitClient
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            test -f dist/GitClient/GitClient.exe
          else
            test -x dist/GitClient/bin/GitClient
          fi
      - name: Smoke-test packaged Linux launcher
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a bash -c '
            dist/GitClient/bin/GitClient > /tmp/gitclient-launch.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            sleep 12
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/gitclient-launch.log
              echo "Packaged JavaFX application exited unexpectedly"
              exit 1
            fi
          '
      - name: Archive Linux application bundle
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf GitClient-Linux.tar.gz -C dist GitClient
      - name: Archive macOS application bundle
        if: runner.os == 'macOS'
        shell: bash
        run: tar -czf GitClient-macOS.tar.gz -C dist GitClient.app
      - name: Archive Windows application bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/GitClient -DestinationPath GitClient-Windows.zip
      - name: Upload native installer
        uses: actions/upload-artifact@v4
        with:
          name: GitClient-Installer-${{ runner.os }}
          path: installers/*
          if-no-files-found: error
      - name: Upload platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: GitClient-${{ runner.os }}
          path: GitClient-*
          if-no-files-found: error
