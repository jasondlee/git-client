name: Package desktop application

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 27
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Build and verify modules
        run: mvn --batch-mode --no-transfer-progress install
      - name: Create modular runtime image
        run: mvn --batch-mode --no-transfer-progress -pl git-app javafx:jlink
      - name: Verify runtime includes application module
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            git-app/target/image/bin/java.exe --describe-module gitclient.app
          else
            git-app/target/image/bin/java --describe-module gitclient.app
          fi
      - name: Create platform application bundle
        shell: bash
        run: |
          jpackage --type app-image --name GitClient \
            --runtime-image git-app/target/image \
            --module gitclient.app/io.github.jasondlee.gitclient.app.GitClientApp \
            --dest dist
      - name: Verify application bundle exists
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -d dist/GitClient.app
            test -x dist/GitClient.app/Contents/MacOS/GitClient
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            test -f dist/GitClient/GitClient.exe
          else
            test -x dist/GitClient/bin/GitClient
          fi
      - name: Archive Linux application bundle
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf GitClient-Linux.tar.gz -C dist GitClient
      - name: Archive macOS application bundle
        if: runner.os == 'macOS'
        shell: bash
        run: tar -czf GitClient-macOS.tar.gz -C dist GitClient.app
      - name: Archive Windows application bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/GitClient -DestinationPath GitClient-Windows.zip
      - name: Upload platform bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GitClient-${{ runner.os }}
          path: GitClient-*
          if-no-files-found: error
